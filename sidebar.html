<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' file:; media-src file:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">

  <title>Explorer Sidebar</title>

  <!-- Same font -->
  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Reuse same styles -->
  <link rel="stylesheet"
        href="style.css">
</head>

<body class="sidebar-mode">

  <div class="sidebar-app">

    <!-- Compact top controls -->
    <header class="sidebar-top-controls">

      <!-- File Type Filter -->
      <select id="filter-select" aria-label="File type filter">

        <option value="all">
          📁 All Files
        </option>

        <option value="images">
          🖼️ Images
        </option>

        <option value="png">
          PNG
        </option>

        <option value="jpg">
          JPG
        </option>

        <option value="pdf">
          PDF
        </option>

        <option value="word">
          Word
        </option>

        <option value="excel">
          Excel
        </option>

        <option value="ppt">
          PowerPoint
        </option>

      </select>

      <!-- Sorting -->
      <select id="sort-select" aria-label="Sort order">

        <option value="name-asc">
          A-Z
        </option>

        <option value="name-desc">
          Z-A
        </option>

        <option value="size-asc">
          Size ↑
        </option>

        <option value="size-desc">
          Size ↓
        </option>

        <option value="date-asc">
          Oldest
        </option>

        <option value="date-desc">
          Newest
        </option>

      </select>

    </header>

    <!-- Folder Path -->
    <div class="path-bar">

      <span class="path-label">
        Location:
      </span>

      <div id="path">
        Waiting for Explorer...
      </div>
      <button id="refresh-btn" class="secondary-btn" title="Refresh (F5 or Ctrl+R)">Refresh</button>

    </div>

    <div id="scan-status" class="scan-status" hidden>
      <progress id="scan-progress" aria-label="Scanning folders"></progress>
      <span id="scan-message" role="status" aria-live="polite"></span>
      <button id="cancel-scan-btn" class="secondary-btn" title="Cancel scan (Escape)">Cancel</button>
    </div>

    <!-- SAME TREE UI -->
    <main class="tree-panel">

      <div id="tree-container" role="tree" aria-label="Explorer folder contents">

        <div class="empty-tree-state">

          <span class="empty-icon">
            📂
          </span>

          <p>
            Open File Explorer
          </p>

        </div>

      </div>

    </main>

  </div>

  <script src="renderer.js"></script>
  <script src="sidebar.js"></script>

</body>
</html>
